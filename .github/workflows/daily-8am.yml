name: Daily Job at 8 AM

on:
  schedule:
    - cron: "30 2 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print starting message
        run: echo "Daily 8 AM job started!"

      - name: Display current date and time
        run: date

      - name: Print completion message
        run: echo "Daily job completed successfully!"
